<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Produtos</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">Loja Fácil</a>
      <button class="btn btn-outline-light ms-auto" id="btnModoEscuro">🌙 Modo Escuro</button>
    </div>
  </nav>

  <div class="container my-4">

    <h1 class="mb-4 text-center">Sistema de Cadastro de Produtos</h1>

    <!-- Formulário -->
    <div class="card mb-4">
      <div class="card-body">
        <h5 class="card-title mb-3">Cadastrar Produto</h5>

        <!-- Aqui entra o alerta de erro, quando existir -->
        <div id="alertaContainer"></div>

        <form id="formProduto">
          <input type="hidden" id="produtoId">

          <div class="row g-3">
            <div class="col-md-6">
              <label for="nome" class="form-label">Nome do Produto</label>
              <input type="text" class="form-control" id="nome">
            </div>

            <div class="col-md-6">
              <label for="categoria" class="form-label">Categoria</label>
              <input type="text" class="form-control" id="categoria">
            </div>

            <div class="col-md-4">
              <label for="preco" class="form-label">Preço (R$)</label>
              <input type="number" step="0.01" class="form-control" id="preco">
            </div>

            <div class="col-md-4">
              <label for="quantidade" class="form-label">Quantidade em Estoque</label>
              <input type="number" class="form-control" id="quantidade">
            </div>
          </div>

          <div class="mt-3">
            <button type="submit" class="btn btn-primary" id="btnCadastrar">Cadastrar</button>
            <button type="button" class="btn btn-secondary" id="btnLimpar">Limpar</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Lista de produtos -->
    <div class="card">
      <div class="card-body">

        <div class="row g-2 mb-3 align-items-end">
          <div class="col-md-6">
            <label for="pesquisa" class="form-label">Pesquisar por nome</label>
            <input type="text" class="form-control" id="pesquisa" placeholder="Digite o nome do produto...">
          </div>
          <div class="col-md-6">
            <label for="ordenar" class="form-label">Ordenar por preço</label>
            <select class="form-select" id="ordenar">
              <option value="nenhuma">Sem ordenação</option>
              <option value="crescente">Menor preço primeiro</option>
              <option value="decrescente">Maior preço primeiro</option>
            </select>
          </div>
        </div>

        <div class="table-responsive">
          <table class="table table-striped align-middle">
            <thead>
              <tr>
                <th>Produto</th>
                <th>Categoria</th>
                <th>Preço</th>
                <th>Quantidade</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="tabelaProdutos">
              <!-- Linhas geradas via JavaScript -->
            </tbody>
          </table>
        </div>

      </div>
    </div>

  </div>

  <!-- Modal de confirmação de exclusão -->
  <div class="modal fade" id="modalExcluir" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Confirmar exclusão</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          Tem certeza que deseja excluir este produto?
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-danger" id="btnConfirmarExclusao">Excluir</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Rodapé -->
  <footer class="bg-dark text-light text-center py-3 mt-5">
    <p class="mb-0">Loja Fácil &copy; 2026 - Desafio Front-End Intermediário</p>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
