<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <header class="page-header">
            <span class="eyebrow">ORGANIZAÇÃO PESSOAL</span>
            <h1>Lista de tarefas</h1>
            <p>Registre o que precisa ser feito e acompanhe seu progresso.</p>
        </header>
        <form class="task-form" id="formTarefa">
            <label for="tarefa">Nova tarefa</label>
            <div class="input-row">
                <input type="text" id="tarefa" placeholder="Digite aqui uma tarefa" autocomplete="off">
                <button id="adicionar" type="button">Adicionar</button>
            </div>
        </form>
        <ul id="lista"></ul>
        <p id="contador">Total de tarefas: 0</p>
    </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
